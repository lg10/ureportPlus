<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="${contextPath}/ureport/res/ureport-asserts/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UReport2 报表管理中心</title>
<style>
    body {
        background-color: #f5f5f5;
        padding-top: 20px;
    }
    .console-container {
        max-width: 960px;
        margin: 0 auto;
    }
    .console-header {
        background: #fff;
        padding: 20px 30px;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .console-header h3 {
        margin: 0;
        color: #333;
    }
    .report-list {
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        overflow: hidden;
    }
    .report-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 24px;
        border-bottom: 1px solid #f0f0f0;
        transition: background 0.15s;
    }
    .report-item:last-child {
        border-bottom: none;
    }
    .report-item:hover {
        background: #fafafa;
    }
    .report-name {
        font-size: 15px;
        color: #333;
    }
    .report-name .glyphicon {
        color: #999;
        margin-right: 8px;
    }
    .report-path {
        font-size: 12px;
        color: #aaa;
        margin-left: 24px;
    }
    .report-actions .btn {
        margin-left: 6px;
    }
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #999;
    }
    .empty-state .glyphicon {
        font-size: 48px;
        display: block;
        margin-bottom: 16px;
        color: #ddd;
    }
    .stats {
        font-size: 13px;
        color: #999;
    }
    .stats strong {
        color: #337ab7;
    }
</style>
</head>
<body>
<div class="console-container">

    <!-- 头部 -->
    <div class="console-header">
        <div>
            <h3>UReport2 报表管理中心</h3>
            <span class="stats">共 <strong>${totalReports}</strong> 个报表</span>
        </div>
        <a href="${contextPath}/ureport/designer" class="btn btn-primary">
            <span class="glyphicon glyphicon-plus"></span> 新建报表
        </a>
    </div>

    <!-- 报表列表 -->
    <div class="report-list">
        #if($totalReports == 0)
        <div class="empty-state">
            <span class="glyphicon glyphicon-file"></span>
            <p>暂无报表文件</p>
            <p style="font-size:12px">点击右上角「新建报表」开始创建，或将 .ureport.xml 文件放入 ureportfiles 目录</p>
        </div>
        #else
            #foreach($report in $reports)
            <div class="report-item">
                <div>
                    <span class="report-name">
                        <span class="glyphicon glyphicon-list-alt"></span>${report.name}
                    </span>
                    <span class="report-path">${report.path}</span>
                </div>
                <div class="report-actions">
                    <a href="${contextPath}/ureport/preview?_u=${report.file}" class="btn btn-sm btn-info" target="_blank">
                        <span class="glyphicon glyphicon-eye-open"></span> 预览
                    </a>
                    <a href="${contextPath}/ureport/designer?_u=${report.file}" class="btn btn-sm btn-default" target="_blank">
                        <span class="glyphicon glyphicon-edit"></span> 编辑
                    </a>
                </div>
            </div>
            #end
        #end
    </div>

</div>
</body>
</html>
